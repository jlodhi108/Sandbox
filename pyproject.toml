[project]
name = "code-modernizer"
version = "0.1.0"
description = "Automated code modernization engine: rewrites legacy code chunk-by-chunk with a local LLM, verifying every rewrite in an isolated sandbox before accepting it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "jlodhi108" }]
keywords = ["llm", "code-modernization", "refactoring", "legacy-code", "langgraph", "tree-sitter", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "tree-sitter>=0.23.0",              # Query/QueryCursor API — captures() returns {name: [Node]}
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "docker>=7.1.0",
    "pathspec>=0.12.0",
    "PyGithub>=2.4.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=3.0.0",                   # tested against 3.4.7 — @mcp.tool/Client/instructions= API
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "hypothesis>=6.100.0"]

[project.urls]
Repository = "https://github.com/jlodhi108/Sandbox"
Issues = "https://github.com/jlodhi108/Sandbox/issues"

[project.scripts]
code-modernizer = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "llm_budget", "track_record", "regression_tests", "target_tests", "mcp_server"]

[tool.setuptools.packages.find]
include = ["agents*", "chunker*", "languages*", "sandbox*", "git_ops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
